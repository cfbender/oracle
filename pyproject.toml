[project]
name = "cardid"
version = "0.1.0"
description = "Offline tooling for The Gathering's webcam card recognition: dataset, synthetic degradation, embedding training, evaluation, export."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "imagehash>=4.3",
    "numpy>=1.26",
    "onnx>=1.23.0",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "torch>=2.4",
    "torchvision>=0.19",
    "tqdm>=4.66",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cardid"]
