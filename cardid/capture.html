<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cardid capture</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #14161a; color: #e6e6e6; display: grid; grid-template-columns: 1fr 380px; height: 100vh; }
  #stage { position: relative; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
  video { max-width: 100%; max-height: 100vh; display: block; cursor: crosshair; }
  #overlay { position: absolute; pointer-events: none; }
  aside { padding: 12px 14px; overflow-y: auto; border-left: 1px solid #2a2d33; font-size: 14px; }
  h1 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
  .muted { color: #9aa0a6; }
  .stats { display: flex; gap: 14px; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
  .stats b { font-size: 18px; display: block; }
  #status { min-height: 1.4em; margin-bottom: 8px; }
  #status.err { color: #ff7b72; }
  #card { display: block; width: 125px; height: 175px; background: #222; border-radius: 4px; margin-bottom: 8px; image-rendering: auto; }
  .cand { display: flex; align-items: center; gap: 8px; padding: 6px; border: 1px solid #2a2d33; border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
  .cand:hover { background: #1f2329; }
  .cand img { width: 96px; height: 70px; object-fit: cover; border-radius: 3px; background: #222; }
  .cand .key { width: 18px; height: 18px; border-radius: 4px; background: #2a2d33; display: inline-grid; place-items: center; font-size: 12px; }
  .cand .name { font-weight: 600; }
  .cand .sim { margin-left: auto; color: #9aa0a6; font-variant-numeric: tabular-nums; }
  .cand.best { border-color: #4c8dff; }
  input[type=search] { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid #2a2d33; background: #0e1013; color: inherit; margin: 8px 0; }
  #results .cand img { width: 72px; height: 52px; }
  .row { display: flex; gap: 8px; }
  button { background: #2a2d33; color: inherit; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  select { background: #0e1013; color: inherit; border: 1px solid #2a2d33; border-radius: 6px; padding: 4px; }
  kbd { background: #2a2d33; border-radius: 3px; padding: 0 4px; font-size: 12px; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>
<aside>
  <h1>cardid capture</h1>
  <div class="row" style="margin-bottom:8px">
    <select id="devices"></select>
    <span id="res" class="muted"></span>
  </div>
  <div class="stats">
    <div><b id="s-labeled">0</b><span class="muted">labeled</span></div>
    <div><b id="s-top1">–</b><span class="muted">top-1</span></div>
    <div><b id="s-top5">–</b><span class="muted">top-5</span></div>
    <div><b id="s-ms">–</b><span class="muted">ms</span></div>
  </div>
  <div id="status" class="muted">Click a card. <kbd>1</kbd>–<kbd>5</kbd> confirm, <kbd>S</kbd> skip, <kbd>/</kbd> search, shift-drag to box a card manually.</div>
  <img id="card" alt="">
  <div id="cands"></div>
  <input id="q" type="search" placeholder="search by name when none match…" autocomplete="off">
  <div id="results"></div>
  <div class="row"><button id="skip">skip (S)</button></div>
</aside>
<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const status = document.getElementById('status');
const cands = document.getElementById('cands');
const results = document.getElementById('results');
const q = document.getElementById('q');
const devices = document.getElementById('devices');
const CROP = 640; // native pixels around the click sent to the server

let current = null;      // {capture_id, candidates, quad, cropOrigin}
let drag = null;
let stream = null;

async function start(deviceId) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  const constraints = { video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } }, audio: false };
  if (deviceId) constraints.video.deviceId = { exact: deviceId };
  stream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject = stream;
  await new Promise(r => video.onloadedmetadata = r);
  document.getElementById('res').textContent = `${video.videoWidth}×${video.videoHeight}`;
  const list = await navigator.mediaDevices.enumerateDevices();
  devices.innerHTML = '';
  for (const d of list.filter(d => d.kind === 'videoinput')) {
    const o = document.createElement('option');
    o.value = d.deviceId; o.textContent = d.label || d.deviceId.slice(0, 8);
    o.selected = stream.getVideoTracks()[0].getSettings().deviceId === d.deviceId;
    devices.appendChild(o);
  }
  sizeOverlay();
}
devices.onchange = () => start(devices.value);
window.onresize = sizeOverlay;
function sizeOverlay() {
  const r = video.getBoundingClientRect(), s = overlay.parentElement.getBoundingClientRect();
  overlay.width = r.width; overlay.height = r.height;
  overlay.style.left = (r.left - s.left) + 'px'; overlay.style.top = (r.top - s.top) + 'px';
}

// display coords -> native video pixels
function toNative(e) {
  const r = video.getBoundingClientRect();
  return [(e.clientX - r.left) * video.videoWidth / r.width, (e.clientY - r.top) * video.videoHeight / r.height];
}
function toDisplay(x, y) {
  const r = video.getBoundingClientRect();
  return [x * r.width / video.videoWidth, y * r.height / video.videoHeight];
}

function grab(cx, cy, size) {
  const w = video.videoWidth, h = video.videoHeight;
  const half = size / 2;
  const x0 = Math.max(0, Math.min(w - size, Math.round(cx - half)));
  const y0 = Math.max(0, Math.min(h - size, Math.round(cy - half)));
  const sw = Math.min(size, w), sh = Math.min(size, h);
  const c = document.createElement('canvas');
  c.width = sw; c.height = sh;
  c.getContext('2d').drawImage(video, x0, y0, sw, sh, 0, 0, sw, sh);
  return { data: c.toDataURL('image/jpeg', 0.92), x0, y0 };
}

video.addEventListener('mousedown', e => {
  if (!e.shiftKey) return;
  drag = { start: toNative(e), end: toNative(e) };
  e.preventDefault();
});
video.addEventListener('mousemove', e => {
  if (!drag) return;
  drag.end = toNative(e);
  drawOverlay();
});
video.addEventListener('mouseup', async e => {
  if (drag) {
    const [ax, ay] = drag.start, [bx, by] = toNative(e);
    drag = null;
    if (Math.abs(ax - bx) > 10 && Math.abs(ay - by) > 10) return identify((ax + bx) / 2, (ay + by) / 2, [ax, ay, bx, by]);
    return;
  }
  const [x, y] = toNative(e);
  identify(x, y, null);
});

async function identify(x, y, rect) {
  let size = CROP;
  if (rect) size = Math.max(CROP, Math.ceil(Math.max(Math.abs(rect[2] - rect[0]), Math.abs(rect[3] - rect[1])) * 1.3));
  const g = grab(x, y, size);
  const body = { image: g.data, click: [x - g.x0, y - g.y0], rect: rect && [rect[0] - g.x0, rect[1] - g.y0, rect[2] - g.x0, rect[3] - g.y0] };
  setStatus('identifying…');
  const t0 = performance.now();
  const res = await fetch('/identify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await res.json();
  if (!res.ok) return setStatus(j.error, true);
  document.getElementById('s-ms').textContent = `${j.ms} / ${Math.round(performance.now() - t0)}`;
  if (!j.quad) {
    current = null; cands.innerHTML = ''; drawOverlay();
    return setStatus('No card quad found under the click. Shift-drag a box around the card.', true);
  }
  current = { ...j, cropOrigin: [g.x0, g.y0] };
  document.getElementById('card').src = 'data:image/png;base64,' + j.card_png;
  renderCandidates(j.candidates, j.margin);
  drawOverlay();
  setStatus(`card ≈ ${j.card_px} px wide · margin ${j.margin} · ${j.orientation ? 'rotated 180°' : 'upright'}`);
}

function renderCandidates(list, margin) {
  cands.innerHTML = '';
  list.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'cand' + (i === 0 && margin > 0.05 ? ' best' : '');
    d.innerHTML = `<span class="key">${i + 1}</span><img src="/art/${c.id}.jpg" loading="lazy"><div><div class="name">${esc(c.name)}</div><div class="muted">${c.set.toUpperCase()}</div></div><span class="sim">${c.similarity.toFixed(3)}</span>`;
    d.onclick = () => label(c.id, 'confirm');
    cands.appendChild(d);
  });
}

async function label(id, method) {
  if (!current) return;
  const capture_id = current.capture_id;
  current = null; cands.innerHTML = ''; results.innerHTML = ''; q.value = ''; drawOverlay();
  const res = await fetch('/label', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ capture_id, label: id, method }) });
  const j = await res.json();
  if (!res.ok) return setStatus(j.error, true);
  updateStats(j.stats);
  setStatus(id ? `saved ${method} label → data/real/${capture_id}` : 'skipped');
}

function updateStats(s) {
  document.getElementById('s-labeled').textContent = s.labeled;
  document.getElementById('s-top1').textContent = s.labeled ? (s.top1 / s.labeled).toFixed(2) : '–';
  document.getElementById('s-top5').textContent = s.labeled ? (s.top5 / s.labeled).toFixed(2) : '–';
}

let searchTimer = null;
q.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const r = await fetch('/search?q=' + encodeURIComponent(q.value));
    const list = await r.json();
    results.innerHTML = '';
    for (const c of list) {
      const d = document.createElement('div');
      d.className = 'cand';
      d.innerHTML = `<img src="/art/${c.id}.jpg" loading="lazy"><div><div class="name">${esc(c.name)}</div><div class="muted">${c.set.toUpperCase()}</div></div>`;
      d.onclick = () => label(c.id, 'search');
      results.appendChild(d);
    }
  }, 150);
});

document.getElementById('skip').onclick = () => label(null, 'skip');
document.addEventListener('keydown', e => {
  if (e.target === q) { if (e.key === 'Escape') { q.blur(); q.value = ''; results.innerHTML = ''; } return; }
  if (e.key >= '1' && e.key <= '5' && current) label(current.candidates[+e.key - 1]?.id, 'confirm');
  else if (e.key === 's' || e.key === 'S') label(null, 'skip');
  else if (e.key === '/') { e.preventDefault(); q.focus(); }
});

function drawOverlay() {
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  if (drag) {
    const [ax, ay] = toDisplay(...drag.start), [bx, by] = toDisplay(...drag.end);
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2; ctx.strokeRect(ax, ay, bx - ax, by - ay);
  }
  if (current && current.quad) {
    ctx.strokeStyle = '#4c8dff'; ctx.lineWidth = 2; ctx.beginPath();
    current.quad.forEach(([x, y], i) => {
      const [dx, dy] = toDisplay(x + current.cropOrigin[0], y + current.cropOrigin[1]);
      i ? ctx.lineTo(dx, dy) : ctx.moveTo(dx, dy);
    });
    ctx.closePath(); ctx.stroke();
  }
}

function setStatus(msg, err) { status.textContent = msg; status.className = err ? 'err' : 'muted'; }
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

fetch('/stats').then(r => r.json()).then(updateStats);
start().catch(e => setStatus('camera: ' + e.message, true));
</script>
</body>
</html>
